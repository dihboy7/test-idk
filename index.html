<!DOCTYPE html>
<html lang="en" data-theme="classic">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tikvues</title>

    <link rel="shortcut icon" href="https://i.ibb.co/Pv5bS7Zr/14875334.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,799;1,799&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />

    <meta name="title" content="Tikvues" />
    <meta name="description" content="Tikvues, boost your views, likes, followers and fans for free!" />
    <meta name="theme-color" content="#B32624" />

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Open Sans', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            background-color: #0d1117;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 107, 107, 0.18) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(201, 42, 42, 0.12) 0%, transparent 20%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-blobs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.8;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
            background: linear-gradient(135deg, var(--blob-color-1), var(--blob-color-2));
            box-shadow: 0 0 100px var(--blob-color-1);
        }

        .blob-1 {
            --blob-color-1: #ff6b6b;
            --blob-color-2: #fa5252;
            width: 450px;
            height: 450px;
            top: -100px;
            left: -100px;
            animation: float 25s infinite alternate cubic-bezier(0.45, 0, 0.55, 1), pulse 8s infinite;
        }

        .blob-2 {
            --blob-color-1: #c92a2a;
            --blob-color-2: #e03131;
            width: 350px;
            height: 350px;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
            animation: float 22s infinite alternate cubic-bezier(0.45, 0, 0.55, 1), pulse 10s infinite;
        }

        .blob-3 {
            --blob-color-1: #ff8787;
            --blob-color-2: #ff6b6b;
            width: 300px;
            height: 300px;
            top: 40%;
            left: 60%;
            animation-delay: -10s;
            animation: float 28s infinite alternate cubic-bezier(0.45, 0, 0.55, 1), pulse 12s infinite;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }

            33% {
                transform: translate(40px, 60px) scale(1.15) rotate(120deg);
            }

            66% {
                transform: translate(-30px, 30px) scale(0.85) rotate(240deg);
            }

            100% {
                transform: translate(0, 0) scale(1) rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 0.7;
            }
        }

        :root {
            --bg: #0d1117;
            --fg: #e6edf3;
            --crd-bg: rgba(22, 27, 34, 0.7);
            --crd-bdr: rgba(48, 54, 61, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --blur: 12px;
            --crd-hvr: rgba(239, 68, 68, 0.2);
            --prim: #ef4444;
            --prim-hvr: #dc2626;
            --rad: 0.5rem;
            --hdr-h: 4rem;
            --txt-mut: rgba(156, 163, 175, 1);
        }

        .hdr {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.95) 0%, rgba(13, 17, 23, 0.85) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 107, 107, 0.2);
            height: var(--hdr-h);
        }

        .hdr-cntr {
            display: flex;
            height: var(--hdr-h);
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            max-width: 1800px;
            margin: 0 auto;
        }

        .logo-lnk {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .hdr-nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-lnk {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
        }

        .nav-btn.grd {
            background: linear-gradient(135deg, #ff6b6b 0%, #fa5252 50%, #e03131 100%);
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: var(--rad);
            border: none;
            font-weight: 600;
            text-decoration: none;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #000001;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading-bar-container {
            width: 220px;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin-top: 2rem;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: width 0.3s;
        }

        .video-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            object-fit: cover;
            filter: blur(6px) brightness(0.6);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .container {
            max-width: 1200px;
            margin: var(--hdr-h) auto 0;
            padding: 2rem 1rem;
            position: relative;
            z-index: 10;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .colsmenu>div {
            background: var(--crd-bg);
            border: 1px solid var(--crd-bdr);
            padding: 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .service-card-button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            border-radius: 8px;
            border: none;
            background: var(--prim);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .disabled-service {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nonec {
            display: none !important;
        }

        .service-form input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--txt-mut);
        }
    </style>
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header id="hdr" class="hdr">
        <div class="hdr-cntr">
            <a href="/" class="logo-lnk">Tikvues</a>
            <nav class="hdr-nav">
                <a href="https://discord.gg/Bw38h7dZHD" class="nav-lnk" target="_blank">Discord</a>
                <a href="https://t.me/tik0kerz" class="nav-btn grd" target="_blank">Telegram</a>
            </nav>
        </div>
    </header>

    <div id="loadingScreen" class="loading-screen">
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <div class="loading-text" style="margin-top: 1rem; color: #888;">Starting...</div>
    </div>

    <video class="video-background" autoplay loop muted playsinline id="background-video">
        <source
            src="https://cdn.akamai.steamstatic.com/steamcommunity/public/images/items/1313140/c80d1a3ea315f69f72cbb77bffe42c5ed0f7b945.mp4"
            type="video/mp4" />
    </video>

    <div class="overlay"></div>

    <div class="container">
        <div class="services-banner" style="text-align: center;">
            <img src="https://i.ibb.co/W4MMWYB0/standard.gif" alt="Premium"
                style="max-width: 100%; border-radius: 12px;" />
        </div>

        <div class="services-grid">
            <div class="colsmenu">
                <div>
                    <h5>Views</h5>
                    <button class="service-card-button" data-service="views">Send Views <i
                            class="fa fa-arrow-right"></i></button>
                    <p><small style="color: #888">updated today</small></p>
                </div>
            </div>
            <!-- Other services can be added here -->
        </div>

        <div id="service-forms" style="margin-top: 3rem;">
            <div id="views-form" class="nonec"
                style="max-width: 600px; margin: 0 auto; background: var(--crd-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--crd-bdr);">
                <h5 style="margin-bottom: 1.5rem;">TikTok Views</h5>
                <form data-service-type="views" class="service-form">
                    <input type="text" name="link" placeholder="Enter Video URL" required />
                    <button type="submit" class="nav-btn grd"
                        style="width: 100%; padding: 0.8rem; cursor: pointer;">Send Views Now</button>
                    <div class="message-area" style="margin-top: 1rem; text-align: center;"></div>
                </form>
            </div>
        </div>

        <footer>
            <p>&copy; 2024-2025 Tikvues. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Loading Screen logic
            const loadingScreen = document.getElementById("loadingScreen");
            const loadingBar = document.getElementById("loadingBar");
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingScreen.style.opacity = "0";
                        setTimeout(() => loadingScreen.remove(), 800);
                    }, 500);
                }
                loadingBar.style.width = progress + "%";
            }, 100);

            // Toggle Forms
            document.querySelectorAll("[data-service]").forEach(btn => {
                btn.addEventListener("click", () => {
                    const service = btn.dataset.service;
                    document.querySelector(".services-grid").classList.add("nonec");
                    document.getElementById(service + "-form").classList.remove("nonec");
                });
            });

            // Form Logic with Vercel API Proxy
            document.querySelectorAll(".service-form").forEach(form => {
                form.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const serviceType = form.dataset.serviceType;
                    const submitBtn = form.querySelector("button");
                    const messageArea = form.querySelector(".message-area");
                    const formData = new FormData(form);
                    const requestData = {};
                    formData.forEach((v, k) => requestData[k] = v);

                    submitBtn.disabled = true;
                    submitBtn.textContent = "Processing...";
                    messageArea.innerHTML = "<p style='color: #44aaff;'>Sending request to Tikvues...</p>";

                    try {
                        const apiEndpoint = `https://tikvues.com/api/${serviceType}`;

                        const response = await fetch(apiEndpoint, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(requestData),
                        });

                        const data = await response.json();

                        if (response.ok && data.success !== false) {
                            messageArea.innerHTML = "<p style='color: #44ff44;'>Sent Successfully!</p>";
                        } else {
                            messageArea.innerHTML = `<p style='color: #ff4444;'>Error: ${data.message || "Failed"}</p>`;
                        }
                    } catch (error) {
                        messageArea.innerHTML = "<p style='color: #ff4444;'>Network Error. Please try again.</p>";
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Send Views Now";
                    }
                });
            });
        });
    </script>
</body>

</html>
